<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayman & Sahar | Wedding Invitation</title>
    <meta
      name="description"
      content="Ayman Sharieff & Syeda Sahar Farooq are getting married on September 19, 2026 at North Avenue, Event Space & Banquet Hall."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="site" id="site">
      <section class="hero" id="home">
        <video
          id="heroVideo"
          class="hero-video"
          src="Assests/opening.mp4"
          muted
          playsinline
          preload="auto"
        ></video>
        <div class="petals" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <a href="#big-day" class="scroll-cue">
          <span>Scroll Down</span>
          <svg width="16" height="24" viewBox="0 0 16 24" fill="none" aria-hidden="true">
            <path d="M8 1v20M8 21l6-6M8 21l-6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </section>

      <div id="content" hidden>
      <section class="reveal countdown-section" id="big-day">
        <div class="countdown-arch-wrap">
          <img src="Assests/countdown arch.png" alt="" class="countdown-arch" aria-hidden="true" loading="lazy" decoding="async" />
          <div class="countdown-arch-content">
            <h2 class="script">Countdown</h2>
            <p class="event-date">Until 19 September 2026</p>
            <div class="countdown" id="countdown">
              <div><span id="days">00</span><small>Days</small></div>
              <div><span id="hours">00</span><small>Hours</small></div>
              <div><span id="minutes">00</span><small>Minutes</small></div>
              <div><span id="seconds">00</span><small>Seconds</small></div>
            </div>
          </div>
        </div>
      </section>

      <section class="reveal timeline-section" id="timeline">
        <div class="timeline-particles" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h2 class="script">Evening Timeline</h2>
        <p class="event-date">19 &middot; September &middot; 2026</p>
        <div class="timeline" id="timelineTrack">
          <div class="timeline-fill" id="timelineFill"></div>
          <div class="timeline-row side-left">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/guest-arrival.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>7:30 PM</strong><em>Guest Arrival</em></span>
            </div>
          </div>
          <div class="timeline-row side-right">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/rings.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>8:00 PM</strong><em>Grand Entry</em></span>
            </div>
          </div>
          <div class="timeline-row side-left">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/photography.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>8:15 PM</strong><em>Photography</em></span>
            </div>
          </div>
          <div class="timeline-row side-right">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/dinner.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>8:30 PM</strong><em>Dinner</em></span>
            </div>
          </div>
          <div class="timeline-row side-left">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/sweetmoments.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>10:00 PM</strong><em>Sweet Moments</em></span>
            </div>
          </div>
          <div class="timeline-row side-right">
            <span class="timeline-dot"></span>
            <span class="timeline-connector"></span>
            <div class="timeline-card">
              <span class="timeline-icon"><img src="Assests/send-off.png" alt="" loading="lazy" decoding="async" /></span>
              <span class="timeline-info"><strong>11:00 PM</strong><em>Send-Off</em></span>
            </div>
          </div>
        </div>
      </section>

      <section class="reveal setting-section" id="setting">
        <p class="eyebrow">The Venue</p>
        <h2 class="script venue-name">North Avenue</h2>
        <p class="setting-tagline">Where We Celebrate</p>

        <img src="Assests/venue.png" alt="North Avenue" class="venue-image" loading="lazy" decoding="async" />

        <a
          class="btn-venue"
          href="https://www.google.com/maps/search/?api=1&query=North+Avenue+Event+Space+%26+Banquet+Hall"
          target="_blank"
          rel="noopener"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z" stroke="currentColor" stroke-width="1" stroke-linejoin="round" />
            <circle cx="12" cy="10" r="1.8" stroke="currentColor" stroke-width="1" />
          </svg>
          Open in Maps
        </a>
      </section>

      <section class="reveal gifts-section" id="gifts">
        <img src="Assests/gift-card.png" alt="Wedding Gifts — your presence is the greatest gift we can receive" class="full-card" loading="lazy" decoding="async" />
      </section>

      <footer class="reveal closing">
        <img src="Assests/closing-card.png" alt="Be part of our happily ever after — Ayman Sharieff & Syeda Sahar Farooq, September 19 2026" class="full-card" loading="lazy" decoding="async" />
        <div class="petals" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </footer>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
